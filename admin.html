<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    // Tema antes de pintar: lo elegido en este navegador, o el del sistema.
    (function () { var t = 'auto'; try { t = localStorage.getItem('med.theme') || 'auto'; } catch (e) {}
      var d = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = t; document.documentElement.dataset.themeResolved = d ? 'dark' : 'light'; })();
  </script>
  <title>Panel de la clínica · Medesthetique</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#14233f">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=Quicksand:wght@400;600&display=swap">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/admin.css">
  <link rel="stylesheet" href="assets/css/glass.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
</head>
<body class="admin">
  <!-- Acceso de demostración: la maqueta no tiene autenticación real -->
  <div class="login" id="login">
    <form class="login-card" id="login-form">
      <span class="wordmark"><b>Med<i>•</i>Esthetique</b><small>CENTRO MÉDICO ESTÉTICO</small></span>
      <h1 class="display">Panel de la clínica</h1>
      <p class="note">Acceso de demostración. Pacientes y citas son ficticios y se guardan solo en este navegador.</p>
      <label class="field"><span>Usuario</span><input class="input" name="user" value="recepcion@medesthetique.demo" autocomplete="off"></label>
      <label class="field"><span>Contraseña</span><input class="input" type="password" name="pass" value="demo-demo" autocomplete="off"></label>
      <button class="btn btn-primary btn-block" type="submit">Entrar al panel</button>
      <a class="note" href="index.html">← Volver al sitio</a>
    </form>
  </div>

  <aside class="side" id="side">
    <a class="side-brand wordmark is-light" href="index.html" title="Ir al sitio"><b>Med<i>•</i>Esthetique</b><small>PANEL DE LA CLÍNICA</small></a>
    <nav class="side-nav" id="side-nav" aria-label="Secciones del panel"></nav>
    <div class="side-foot">
      <a class="btn btn-sm btn-block side-site" href="index.html" target="_blank" rel="noopener">Ver sitio público</a>
      <span class="demo-badge">Datos de demostración</span>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="icon-btn side-toggle" id="side-toggle" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8h16M4 16h16"/></svg>
      </button>
      <div>
        <h1 class="display" id="view-title">Resumen</h1>
        <p class="note" id="view-sub"></p>
      </div>
      <div class="top-actions" id="top-actions"></div>
      <button class="icon-btn theme-btn" type="button" data-theme-toggle aria-label="Cambiar a tema oscuro" aria-pressed="false">
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
        </button>
    </header>
    <main id="view" class="view"></main>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer drawer-wide" id="drawer" aria-label="Detalle"></aside>
  <div class="modal" id="modal" role="dialog" aria-modal="true"><div class="modal-card" id="modal-card"></div></div>

  <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
